status:
  scope: >-
    Formalized: exactly the eleven statements listed in comparator-node.json
    and stated in ChallengeNode.lean, with sorry-free proofs in Node/. All
    are unconditional. The node results concern one explicit model on the
    closed unit square with uniform prior and real variables; the monomial
    results concern K = prod w_j^(2 k_j) with prior density prod w_j^(h_j)
    on the closed unit cube; the monodromy theorem is the monodromy of the
    complex logarithm in Mathlib's covering-space sense.

    Not claimed. No singular learning theory beyond the monomial case: no
    resolution of singularities, no reduction of general models to
    normal-crossing form (so the free-energy asymptotic is proved for monomial
    models only), no random-sample (stochastic) free energy, and no
    b-functions, no Picard–Lefschetz theory and no
    meromorphic continuation of zeta; the Kan-extension and b-function
    framing in the description is not formalized. The results are classical
    or elementary; priority among Lean formalizations is unknown. Proof
    terms were not reviewed line by line by a human; see the review block.

    Sorry and native_decide. The development is sorry-free and
    native_decide-free, and the compared theorems depend only on propext,
    Classical.choice and Quot.sound. ChallengeNode.lean's own eleven deliberate
    sorries are the comparator placeholders and are not counted.
