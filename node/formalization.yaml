    self-assessed; automated mechanical checks in this repository's CI
    (lake build with sorry census; lake comparator from the pinned Lean
    v4.35.0 toolchain with statement match and replay through Lean's
    kernel, NanoDa and con-ron); no line-by-line human review of proof
    terms; no external mathematical peer review
  reviewers:
    - "Rohan Badade (self)"
  notes: >-
    Checked mechanically: lake build on the pinned toolchain with no sorry
    warnings and no errors; #print axioms on every compared theorem
    (propext, Classical.choice, Quot.sound); and the toolchain's lake
    comparator with comparator-node.json against ChallengeNode.lean,
    covering statement match, definition identity, the axiom allowlist and
    kernel replay. These repository checks are distinct from Palomar's own
    verification. Checked numerically before formalization: the zeta
    closed form, and the error of the sharp partition-function formula
    divided by exp(-n) (0.0074, 0.00057 and 0.0000676 at n = 5, 20, 60).
    Checked by a human: the choice of statements and this file. Not done:
    line-by-line human reading of proof terms; external mathematical review.

