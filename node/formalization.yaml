# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4. Second Palomar entry from this repository (the node w1 w2).
# Comparator configuration: comparator-node.json.
version: "v0.4"

project:
  name: "One node, one density: the density of states of w1 w2 on the unit square; the zeta function, sharp partition function and free energy of the singular learning model K = (w1 w2)^2; and the zeta function, learning coefficient, multiplicity and free energy of monomial (normal-crossing) models"
  description: >-
    The node f(w) = w1 w2 on the closed unit square [0,1]^2 has one
    distinguished function, P(s) = -log s. This entry proves in Lean 4 and
    Mathlib that P is the density of states of the node, and that the zeta
    function, partition function and free energy of the toy singular
    learning model K(w) = (w1 w2)^2 with uniform prior on [0,1]^2 are
    explicit transforms of it; it also states the monodromy of the
    logarithm in Mathlib's covering-space sense, and treats the general
    monomial (normal-crossing) zeta function and free energy. Eleven
    statements are compared.

    (1) Density of states: the pushforward of Lebesgue measure on [0,1]^2
    under w -> w1 w2 equals the measure on (0,1] with density -log s. (The
    function -log s is also the integral over the fibre {w1 w2 = s} of the
    Gelfand–Leray form dw1/w1; this interpretation is not separately
    stated.) (2) For real z, the learning zeta function
    zeta(z) = integral over [0,1]^2 of ((w1 w2)^2)^z is finite (the integrand
    is integrable) if and only if z > -1/2, and (3) for z > -1/2 it equals
    1/(2z+1)^2. The closed form has a double pole at -1/2, which in
    Watanabe's singular learning theory corresponds to learning coefficient
    1/2 and multiplicity 2; meromorphic continuation is not stated.
    (4)-(6) Monomial (normal-crossing) zeta function. For natural numbers
    k_1, ..., k_d, real h_1, ..., h_d, K(w) = prod_j w_j^(2 k_j) and the
    (unnormalized) prior density phi(w) = prod_j w_j^(h_j) on [0,1]^d:
    (4) K^z phi is integrable on the cube if and only if
    2 k_j z + h_j + 1 > 0 for every j (real z); (5) then
    zeta(z) = integral of K^z phi = prod_j 1/(2 k_j z + h_j + 1); and
    (6) if all k_j > 0, lambda = min_j (h_j + 1)/(2 k_j) and m >= 1 is the
    number of indices attaining it, then (z + lambda)^m zeta(z) tends to a
    nonzero limit as z -> -lambda from above, i.e. zeta has a pole of order
    exactly m at -lambda (real variable, one-sided). This is the
    normal-crossing form to which singular learning theory reduces a model
    after resolution of singularities, where (lambda, m) are the learning
    coefficient and its multiplicity; the resolution step is not
    formalized. (2)-(3) are the case d = 2, k = (1,1), h = 0, stated on
    R x R and proved separately through (1). (10)-(11) Monomial free energy:
    for the same models with all k_j > 0 and h_j > -1, the partition
    function Z(n) = integral over [0,1]^d of exp(-n K) phi satisfies
    Z(n) = Theta(n^(-lambda) (log n)^(m-1)) as real n -> infinity (upper
    and lower bounds by constant multiples), so
    F(n) = -log Z(n) = lambda log n - (m - 1) log log n + O(1). This is
    Watanabe's free-energy asymptotic for models in normal-crossing form;
    the node's (7)-(8) are its d = 2 instance, sharpened there to exact
    constants. The proof is an induction on the dimension, integrating out
    one coordinate at a time with one-variable Laplace-type estimates.
    (7) Sharp partition function: Z(n) = integral over [0,1]^2 of
    exp(-n (w1 w2)^2) satisfies
    Z(n) = (sqrt(pi)/(4 sqrt(n))) (log n + gamma + 2 log 2) + O(exp(-n)) as
    real n -> infinity, where gamma is the Euler–Mascheroni constant.
    (8) Free energy: F(n) = -log Z(n) satisfies
    F(n) - (1/2 log n - log log n) -> log(4/sqrt(pi)), the form
    lambda log n - (m - 1) log log n + O(1) of Watanabe's asymptotics with
    lambda = 1/2, m = 2, here with the exact constant. (9) Monodromy of the
    logarithm: for Mathlib's covering map exp from the complex plane to the
    punctured plane and the loop theta -> exp(2 pi i theta) based at 1,
    IsCoveringMap.monodromy sends the fibre point 0 to 2 pi i. Lifts through
    exp are continuations of log, so P = -log continues to P - 2 pi i
    around s = 0: the unipotent monodromy of the node's period.

    In the Lean development, (2), (3), (7) and (8) are derived from the same transfer
    lemma, a consequence of (1): an integral over the square of a function
    of w1 w2 equals the integral over (0,1] of that function against
    -log s. The zeta function is then the Mellin transform of -log s and
    the partition function its Gaussian Laplace transform. The exact
    constant in (7) comes from Mathlib's value of the derivative of the
    Gamma function at 1/2. Scope: real variables throughout; (1)-(3) and
    (7)-(8) concern one explicit model with uniform prior on the closed unit
    square, and (4)-(6), (10)-(11) monomial models on the closed unit cube;
    resolution of singularities, the reduction of general models to
    normal-crossing form (hence the free-energy asymptotic for general
    models), b-functions and
    Picard–Lefschetz theory are not formalized, and (9) is the monodromy of
    the logarithm itself, not of a family of cycles. All results are classical
    or elementary consequences of classical results; we searched the
    Palomar registry and Mathlib (November 2026) and found no prior
    formalization of them, but did not search other sources, so priority
    among Lean formalizations is unknown.
  authors:
    - "Rohan Badade"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Rohan Badade"

