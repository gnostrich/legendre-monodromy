fidelity:
  divergences: >-
    Between the repository and ChallengeNode.lean, which is what Palomar
    compares: ChallengeNode.lean imports only Mathlib and contains verbatim
    copies of the three definitions in Node/Monodromy.lean (basePt,
    unitLoop, zeroInFibre), in the namespace NodeChallenge instead of Node;
    every other object (the square and cube, the models K, the priors, Z(n),
    zeta, lambda and m, the density) is written inline in the statements. There are no individual statement
    deviations.

    Against the sources: Watanabe's invariants are defined for general
    models with a prior. For the monomial results the prior density
    prod w_j^(h_j) is not normalized; h_j > -1 is assumed for the
    free-energy results (10)-(11), where it is needed for Z(n) to be finite,
    but not for the zeta results (4)-(6), which hold without it. lambda is
    characterized as the minimum of the (h_j + 1)/(2 k_j) by a lower-bound
    hypothesis plus attainment; the pole order is expressed by the nonzero
    one-sided limit of (z + lambda)^m zeta(z); and the free energy is
    deterministic (the integral Z(n) in a real variable n), with the
    O(1) and Theta bounds taken as n -> infinity. For the node results the model is fixed (K = (w1 w2)^2, uniform
    prior on the closed unit square, real parameters), zeta is evaluated
    only for real z, and the double pole is read off the closed form for
    z > -1/2, with the integrability threshold z > -1/2 proved separately,
    rather than through meromorphic continuation. Z(n) and F(n) are
    deterministic integrals in a real variable n, as in the analysis of the
    normalized partition function; no random sample appears. The monodromy
    is that of the logarithm, stated through Mathlib's covering map exp;
    the identification with the period of the node is through P = -log.

