sources:
  - title: "Algebraic Geometry and Statistical Learning Theory"
    authors:
      - "Sumio Watanabe"
    id: "doi:10.1017/CBO9780511800474"
    type: book
    location: "Cambridge Monographs on Applied and Computational Mathematics 25, Cambridge University Press, 2009; the zeta function of a singular model, the learning coefficient and its multiplicity, and the asymptotic Z(n) ~ C n^(-lambda) (log n)^(m-1), F = lambda log n - (m-1) log log n + O(1). Equation and theorem numbers were not checked against a copy of the book."
    relationship: formalizes
    license: "unknown"
    author_endorsement: not-contacted
    note: >-
      The entry formalizes the zeta function, learning coefficient and
      multiplicity of monomial (normal-crossing) models on the unit cube,
      results (4)-(6), and their free energy
      lambda log n - (m - 1) log log n + O(1), results (10)-(11); this is the
      form a model takes after resolution of singularities. It also treats
      one explicit instance in full: the model
      K(w) = (w1 w2)^2 with uniform prior on [0,1]^2, for which lambda = 1/2
      and m = 2 (results (2), (3), (7), (8), with the asymptotics of Z(n) and
      F(n) sharpened to exact constants). The general theorems of the book
      (existence of the learning coefficient for analytic models, resolution
      of singularities, the reduction of a general model to normal-crossing
      form, the stochastic free energy of a random sample) are not
      formalized.
  - title: "Singularities of Differentiable Maps, Volume II: Monodromy and Asymptotics of Integrals"
    authors:
      - "V. I. Arnold"
      - "S. M. Gusein-Zade"
      - "A. N. Varchenko"
    type: book
    location: "Birkhäuser, Monographs in Mathematics 83, 1988: Gelfand–Leray forms, the monodromy of a node, and the link between monodromy and the asymptotics of integrals"
    relationship: background
    license: "unknown"
    author_endorsement: "n/a"
    note: >-
      Background for reading -log s as the period of the node's real fibre
      and for the unipotent monodromy of that period. None of the book's
      general results is formalized; result (9) is only the monodromy of
      the logarithm.
  - title: "B-functions and holonomic systems"
    authors:
      - "Masaki Kashiwara"
    type: paper
    location: "Inventiones Mathematicae 38 (1976), 33-53"
    relationship: background
    license: "unknown"
    author_endorsement: "n/a"
    note: >-
      Framing only, not formalized: with Malgrange's work, the relation
      between roots of b-functions and monodromy eigenvalues, the general
      reason the logarithmic terms of singular learning asymptotics track
      Jordan blocks of monodromy. This entry exhibits one instance (a
      double pole of zeta and a log log n term alongside a unipotent
      monodromy) but proves no general statement.
  - title: "Polynôme de Bernstein-Sato et cohomologie évanescente"
    authors:
      - "Bernard Malgrange"
    type: paper
    location: "Astérisque 101-102 (1983), 243-267"
    relationship: background
    license: "unknown"
    author_endorsement: "n/a"
    note: "Framing only, not formalized; see the Kashiwara entry."
  - title: "Learning Is a Kan Extension"
    authors:
      - "Matthew Pugh"
      - "Jo Grundy"
      - "Corina Cirstea"
      - "Nick Harris"
    id: "arXiv:2502.13810"
    type: preprint
    location: "arXiv v1, 19 February 2025"
    relationship: background
    license: "unknown"
    author_endorsement: not-contacted
    note: >-
      Framing only, not formalized: presents error-minimising learning as a
      Kan extension. In that picture the fibre of inference over the data
      corresponds to the true-parameter set of singular learning theory,
      here the two axes crossing at the node. Nothing in this entry depends
      on it.
  - title: "Presenting Neural Networks via Coherent Functors"
    authors:
      - "Matthew Pugh"
      - "Jo Grundy"
      - "Corina Cirstea"
      - "Nick Harris"
    id: "arXiv:2604.15100"
    type: preprint
    location: "arXiv v1, 16 April 2026"
    relationship: background
    license: "unknown"
    author_endorsement: not-contacted
    note: "Framing only, not formalized; recasts network inference as an extension problem. Nothing in this entry depends on it."
  - title: "mathlib4: the Lean mathematical library"
    authors:
      - "The Mathlib Community"
    id: "https://github.com/leanprover-community/mathlib4"
    type: other
    location: "Mathlib v4.35.0, as pinned by lakefile.toml and lake-manifest.json"
    relationship: background
    license: "Apache-2.0"
    author_endorsement: "n/a"
    note: >-
      The ambient library. ChallengeNode.lean imports only Mathlib. Mathlib
      supplies Lebesgue measure, pushforwards and densities, the Gaussian
      integral, the Gamma function and its derivative at 1/2, the
      Euler–Mascheroni constant, and covering maps with their monodromy
      (including the covering map exp). It is a Lean dependency, not a
      mathematical source for any compared statement.

